name: 持續整合與部署

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 測試階段
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            # requirements-dev.txt 已經 -r requirements.txt，一次裝完執行與測試依賴
            python3 -m pip install -r requirements-dev.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行語法檢查
        run: python -m py_compile main.py config/settings.py api/rate_limiter.py db/models.py db/repository.py modules/exchange_client.py modules/lending_strategy.py modules/line_notifier.py scripts/healthcheck.py utils/logger.py utils/exceptions.py

      - name: 執行單元與功能測試
        # 這裡刻意不加 `|| true`：測試失敗就要擋下合併，否則寫了測試也攔不住壞掉的程式碼
        run: pytest tests/unit tests/functional -q

      - name: 執行 dry-run 端到端測試
        # 取代原本內嵌在 workflow 裡的 heredoc smoke test，驗證內容相同但改得動、看得懂。
        # -m "not live" 排除會連外網的測試，那些留給 integration job 跑。
        run: pytest tests/integration -q -m "not live"

  integration:
    name: 整合/系統測試
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: test
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements-dev.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行整合測試（含 Bitfinex 公開端點）
        # 含 live 標記的測試：只打公開唯讀的 /v2/ticker/fUSD，不帶金鑰、不碰帳戶、
        # 不掛單。連不上時測試內部自行 skip，不會讓 CI 因外部服務抖動變紅燈。
        run: pytest tests/integration -q

  deploy:
    name: 容器化部署階段
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: [test, integration]
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 建立 Podman 映像
        run: |
          podman build -t shuyu-lending-bot .

      - name: 安裝／更新 Quadlet 單元
        # 容器的生命週期改由 systemd --user 管理，不再由這個 job 直接 `podman run`
        # （見 DECISIONS.md D017）。job 收尾時會清掉自己的行程樹，先前容器的 conmon
        # 就是這樣被殺掉的——conmon 一死，容器日誌沒人寫、restart policy 也不會觸發。
        # 由 systemd 啟動的話，conmon 落在 user@.service 的 cgroup 底下，與 job 無關。
        #
        # 單元檔的真實來源是 repo 裡的 systemd/shuyu-lending-bot.container，
        # 每次部署都覆蓋過去，主機上那份不要手改。
        # 掛載目錄的 mkdir 已移進單元的 ExecStartPre，開機自動啟動時也才會成立。
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          mkdir -p ~/.config/containers/systemd
          cp systemd/shuyu-lending-bot.container ~/.config/containers/systemd/

          # 失效告警（TASKS.md B2）：主單元的 OnFailure= 指到這個單元，
          # 所以它必須跟主單元一起安裝，否則 systemd 放棄重啟時會找不到單元，
          # 告警靜悄悄地不會發生——正是 B2 想解掉的那種「以為有人會知道」。
          # 這是一般單元不是 Quadlet 產物，放 systemd/user 而不是 containers/systemd。
          mkdir -p ~/.config/systemd/user
          cp systemd/shuyu-lending-bot-alert.service ~/.config/systemd/user/
          # 告警腳本在容器外執行：容器可能正是壞掉的那一個，不能靠它來報告自己死了。
          mkdir -p ~/.local/share/shuyu-lending-bot
          cp scripts/notify_failure.py ~/.local/share/shuyu-lending-bot/

          systemctl --user daemon-reload

      - name: 重新啟動服務
        # 不需要也不能用 `systemctl --user enable`：Quadlet 產生的單元是動態產物，
        # 開機自動啟動由單元檔裡的 [Install] WantedBy=default.target 交給 generator 處理。
        # restart 前先 reset-failed：單元可能因觸及 StartLimitBurst 停在 failed，
        # 而且 CI 每次部署的 restart 本身也會計入那個次數。
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user reset-failed shuyu-lending-bot.service || true
          systemctl --user restart shuyu-lending-bot.service
          systemctl --user --no-pager status shuyu-lending-bot.service || true

      - name: 驗證容器生命週期真的由 systemd 接管
        # 這一步是刻意加的迴歸防線：先前「自動重啟與容器日誌沒生效」拖了兩個 milestone
        # 才被發現，就是因為部署完只看 `podman ps` 顯示 running 就算過。
        # 現在把三個前提直接斷言在部署流程裡，壞掉當下就會紅燈。
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          echo "--- 服務狀態 ---"
          systemctl --user is-active shuyu-lending-bot.service

          echo "--- conmon 是否存在（沒有它，日誌與重啟都是假的）---"
          CONMON_PID=$(podman inspect shuyu-lending-bot --format '{{.State.ConmonPid}}')
          if [ -z "$CONMON_PID" ] || [ "$CONMON_PID" = "0" ] || ! kill -0 "$CONMON_PID" 2>/dev/null; then
            echo "::error::conmon 行程不存在（PID=$CONMON_PID），容器日誌與自動重啟都不會生效"
            exit 1
          fi

          # 光問「conmon 在不在」擋不住這一步想擋的迴歸（TASKS.md B1）：舊的
          # 「CI job 自己 podman run」做法下，conmon 是在 **job 收尾那一刻** 才被清掉的，
          # 而這個檢查跑在 job 執行期間，那時它還活得好好的。所以要問的不是存不存在，
          # 是 **它登記在誰的 cgroup 底下**——由 systemd 啟動會落在
          # shuyu-lending-bot.service 底下，由 job 啟動則落在 runner 那一群，
          # 這個差異當下就看得出來，不必等到收尾。
          CONMON_CGROUP=$(cat "/proc/$CONMON_PID/cgroup")
          echo "conmon PID=$CONMON_PID，cgroup：$CONMON_CGROUP"
          case "$CONMON_CGROUP" in
            *shuyu-lending-bot.service*) ;;
            *)
              echo "::error::conmon 不在 shuyu-lending-bot.service 的 cgroup 底下"
              echo "::error::容器可能又變回由 CI job 直接 podman run 啟動：$CONMON_CGROUP"
              exit 1
              ;;
          esac

          echo "--- podman logs 是否取得到內容 ---"
          # 這裡一定要合併 stderr（TASKS.md B3）：機器人的日誌走的是 stderr
          # （utils/logger.py 的 logging.StreamHandler() 不帶參數，Python 預設就是 stderr），
          # 而程式沒有任何 print()，所以容器的 stdout 永遠是空的。
          # 舊寫法是 `$(podman logs ... 2>/dev/null)`——`$( )` 只捕捉 stdout、
          # `2>/dev/null` 又把 stderr 丟掉，等於親手扔掉自己要找的東西，永遠不可能通過。
          # 合併之後要另外確認 podman 本身有沒有失敗，否則「no such container」這類
          # 錯誤訊息會被當成「有日誌」而誤放行。
          LOGS_OK=0
          for _ in $(seq 1 15); do
            if CONTAINER_LOGS=$(podman logs --tail=20 shuyu-lending-bot 2>&1) \
               && [ -n "$CONTAINER_LOGS" ]; then
              LOGS_OK=1
              break
            fi
            sleep 2
          done
          if [ "$LOGS_OK" -ne 1 ]; then
            echo "::error::30 秒內 podman logs 仍然沒有內容，conmon 或 log driver 有問題"
            exit 1
          fi
          printf '%s\n' "$CONTAINER_LOGS"

      - name: 驗證失效告警已接上
        # 這道檢查的存在理由與 B2 本身一樣：告警最糟的失敗方式不是「送錯」，
        # 而是「以為接上了、其實沒有」，而且那件事要等機器人真的死掉才會發現。
        # 三個斷言都問「systemd 眼中的實際狀態」而不是「repo 裡寫了什麼」——
        # 少複製一個檔、或 OnFailure= 被刪掉，都會在這裡當場紅燈。
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

          echo "--- 主單元有沒有掛上 OnFailure= ---"
          ON_FAILURE=$(systemctl --user show shuyu-lending-bot.service --property=OnFailure --value)
          echo "OnFailure=$ON_FAILURE"
          case "$ON_FAILURE" in
            *shuyu-lending-bot-alert.service*) ;;
            *)
              echo "::error::主單元沒有掛上 shuyu-lending-bot-alert.service"
              echo "::error::systemd 放棄重啟時不會有任何人被通知（TASKS.md B2）"
              exit 1
              ;;
          esac

          echo "--- 告警單元本身裝好了嗎（systemd 讀得到、解析得動）---"
          if ! systemctl --user cat shuyu-lending-bot-alert.service >/dev/null 2>&1; then
            echo "::error::找不到 shuyu-lending-bot-alert.service，OnFailure= 會指向不存在的單元"
            exit 1
          fi

          echo "--- 告警腳本在不在 ---"
          test -f "$HOME/.local/share/shuyu-lending-bot/notify_failure.py" || {
            echo "::error::告警腳本不存在，告警單元會啟動失敗"
            exit 1
          }

      - name: 檢查容器狀態
        run: |
          podman ps --filter "name=shuyu-lending-bot"
          # 重啟策略已改由 systemd 表達，podman 端應為 no；這裡一併印出來確認兩邊沒打架
          podman inspect shuyu-lending-bot \
            --format 'podman 重啟策略：{{.HostConfig.RestartPolicy.Name}}（應為 no，重啟已交給 systemd）／日誌驅動：{{.HostConfig.LogConfig.Type}}'

      - name: 取得最近容器日誌
        # 讀掛載出來的日誌檔，而不是 `podman logs`：即使容器已經被收掉，檔案還在，
        # 而且這是程式自己寫的完整日誌（含輪替），比容器 stdout 可靠。
        run: |
          LOG_FILE=/workspace/deploy/active-bots/ShuyuLendingBot/logs/bfx_lending_bot.log
          for _ in $(seq 1 15); do
            [ -s "$LOG_FILE" ] && break
            sleep 2
          done
          if [ -s "$LOG_FILE" ]; then
            tail -n 100 "$LOG_FILE"
          else
            echo "::warning::30 秒內 $LOG_FILE 仍是空的，改用 podman logs 作為備援"
            podman logs --tail=100 shuyu-lending-bot || true
          fi
