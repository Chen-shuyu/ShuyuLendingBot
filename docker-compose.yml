# 本機測試用途。正式部署走 systemd --user 管理的 Quadlet 單元
# `systemd/shuyu-lending-bot.container`（見 DECISIONS.md D007、D017）。
# 兩邊的重啟策略與健康檢查要保持一致，否則本機測不出正式環境的行為。
version: "3.9"
services:
  bfx-lending-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bfx-lending-bot
    environment:
      BFX_SECRETS_FILE: /run/secrets/secrets.env
    volumes:
      # 只掛金鑰檔本身，不掛整個目錄（見 DECISIONS.md D022）。與正式部署的
      # Quadlet 單元保持一致；掛目錄會讓容器連帶看到同目錄下的其他東西。
      - /home/shuyu/.config/bfx-lending-bot/secrets.env:/run/secrets/secrets.env:ro
      - /home/shuyu/.config/bfx-lending-bot/logs:/app/logs
      # SQLite 檔必須掛在容器外，否則每次重建容器紀錄就歸零
      - /home/shuyu/.config/bfx-lending-bot/data:/app/data
    # 原本是 unless-stopped，會與 main.py 的「致命錯誤直接退出」打架：
    # 金鑰無效時變成啟動→退出→啟動的無限迴圈。改用 on-failure，正常結束
    # （離開碼 0）不重啟。compose 的 restart 既沒有次數上限、也認不得離開碼，
    # 節流與「EXIT_FATAL=2 不重啟」只在正式部署那側由 systemd 表達
    # （StartLimitBurst 與 RestartPreventExitStatus，見 D017）。
    restart: on-failure
    healthcheck:
      # 與 podman run 的 --health-cmd 同一支腳本，讀 bot_state 心跳判斷是否還在巡檢
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 60s
      retries: 3
      start_period: 180s
