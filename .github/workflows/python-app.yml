name: 持續整合與部署

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 測試階段
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行語法檢查
        run: python -m py_compile main.py config/settings.py api/rate_limiter.py db/models.py db/repository.py modules/exchange_client.py modules/lending_strategy.py modules/line_notifier.py utils/logger.py utils/exceptions.py

      - name: 執行 smoke test
        run: |
          # main() 現在是常駐 while True 主迴圈，不會自己返回，
          # 所以 smoke test 改成強制 dry-run 只跑一輪 run_once()。
          python - <<'PY'
          import sys
          from pathlib import Path

          from config.settings import load_config, load_secrets_from_disk, resolve_config_path
          from db.repository import Repository
          from main import run_once
          from modules.exchange_client import BitfinexClient
          from modules.lending_strategy import LendingStrategy
          from modules.line_notifier import LineNotifier
          from utils.logger import BotLogger

          root = Path(".").resolve()
          load_secrets_from_disk(root)
          config = load_config(str(resolve_config_path(root)))
          logger = BotLogger(config.get("logging", {}), config.get("logging", {}).get("file"))
          notifier = LineNotifier(config.get("line", {}))
          strategy = LendingStrategy(config)
          client = BitfinexClient(config, logger, dry_run=True)
          # CI 用暫時的 DB 檔，不要動到設定檔指定的正式路徑
          repository = Repository("/tmp/ci_smoke_test.sqlite3")

          if not client.test_connection():
              sys.exit(1)

          run_once(logger, notifier, strategy, client, repository, cancel_settle_seconds=0)

          state = repository.get_state()
          assert state and state["last_run_at"], "巡檢後 bot_state 應該要有心跳時間"
          offers = repository.connection.execute("SELECT COUNT(*) FROM loan_offers").fetchone()[0]
          assert offers > 0, "dry-run 巡檢後 loan_offers 應該要有紀錄"
          repository.close()
          print(f"smoke test ok（落帳 {offers} 筆掛單，心跳 {state['last_run_at']}）")
          PY

      - name: 安裝測試套件
        run: python -m pip install pytest

      - name: 執行單元與功能測試
        run: |
          if [ -d tests/unit ]; then pytest tests/unit -q || true; fi
          if [ -d tests/functional ]; then pytest tests/functional -q || true; fi

  integration:
    name: 整合/系統測試
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: test
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行整合測試
        run: |
          if [ -d tests/integration ]; then pytest tests/integration -q; else echo "No integration tests found"; fi

  deploy:
    name: 容器化部署階段
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: [test, integration]
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 建立 Podman 映像
        run: |
          podman build -t shuyu-lending-bot .

      - name: 停止並移除舊容器
        run: |
          if podman container exists shuyu-lending-bot; then
            podman stop shuyu-lending-bot || true
            podman rm shuyu-lending-bot || true
          fi

      - name: 啟動 Podman 容器
        run: |
          # data 也要掛出來：SQLite 檔留在容器內的話，每次重新部署掛單與收益紀錄就全沒了
          podman run -d \
            --name shuyu-lending-bot \
            -e BFX_SECRETS_FILE=/run/secrets/secrets.env \
            -v /workspace/deploy/active-bots/ShuyuLendingBot:/run/secrets:ro \
            -v /workspace/deploy/active-bots/ShuyuLendingBot/logs:/app/logs \
            -v /workspace/deploy/active-bots/ShuyuLendingBot/data:/app/data \
            shuyu-lending-bot

      - name: 檢查容器狀態
        run: podman ps --filter "name=shuyu-lending-bot"

      - name: 取得最近容器日誌
        run: podman logs --tail=100 shuyu-lending-bot
