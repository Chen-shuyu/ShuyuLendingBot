# 這是專案設定範本檔案。
# 真正的敏感資訊請寫在 secrets.env，並由程式自動載入。

bitfinex:
  api_key: ""
  api_secret: ""
  dry_run_balance_usd: 344.12
  dry_run_frr: 0.0002

strategy:
  # 定價策略。`orderbook_depth` = 依訂單簿排隊位置定價（正式路線，見 DECISIONS.md D030）；
  # `frr_plus` = 舊的 FRR 加減碼，保留只為了能一行切回去做對照。
  # **不要把 frr_plus 當備援**：它已知會把單子掛到市場之上（FRR 高過成交天花板），
  # 自動退回它等於「失敗時切換到一個確定無效的策略」。
  mode: orderbook_depth

  min_required_usd: 150     # 餘額低於此值就整輪不掛單
  min_loan_size_usd: 150    # Bitfinex 單筆放貸的最小金額，決定 spread 最多能拆幾筆

  # 掛單天期。2 天是流動性最好的天期（占市場成交量約 86%），驗證階段用它的理由是
  # **不把資金鎖住**：先確認「成交 → 記錄 → 通知」整條鏈會動，才有資格談長天期。
  # 長期歷史模擬顯示 7／30 天期的年化明顯較高（見 D030 的天期分析），
  # 但那要等第一筆成交跑通、而且要用分桶的方式測，不是改一個數字就好。
  offer_period: 2
  short_duration: 2         # frr_plus 用；orderbook_depth 只在沒設 offer_period 時拿它當預設
  long_duration: 30

  # 我願意排在多少錢後面。這是 orderbook_depth 唯一需要調的旋鈕，
  # 可直接換算成等待時間：除以該天期每小時的成交金額即可。
  # 2026-08-16 實測 2 天期每小時流過約 415 萬 USD，所以 100 萬 ≈ 等 15 分鐘。
  # 調大 = 掛更高的利率、等更久；調小 = 掛更低、更快成交。
  #
  # 為什麼預設偏向「快」：以 344 USD 計，空轉一天損失約 0.074 USD，
  # 而利率多爭 1 個百分點一天只多賺 0.008 USD——**空轉一天要跑 9 天才補得回來**。
  target_queue_usd: 1000000

  # 低於這個日利率就整輪不掛單。**語意是「不賣」，不是「把價格拉高到這裡」**：
  # 舊策略的 max(base, minimum_rate) 會把價格拉到簿子之外，結果是掛一張永遠不會
  # 成交的單，帳面體面、實際等於沒放貸（見 D030）。
  #
  # 這是**絕對地板**，只負責擋住最離譜的情況；真正跟著市場走的下限是下面的
  # market_floor_pct。把這個值調高並不能取代它——寫死的常數一樣會過期（D032）。
  #
  # 0.00021918 = **年化 8.00%**（0.08 / 365），由使用者 2026-08-16 指定。
  # 語意是「年化 8% 以下我不借」，所以低於它的那一輪不掛單、等下一輪。
  #
  # **這個值會實際咬到**，不只是防呆：歷史成交帶是年化 8.68%～10.00%，8% 就貼在
  # 下緣。搭配 market_floor_pct 0.85 來看，常態成交價要在年化 9.41% 以上，
  # 成交價下限才會高過這條線；低於 9.41% 時，真正生效的是這條 8% 的地板。
  #
  # 換句話說：2026-08-16 夜間那種「簿子被低價牆佔住」的情況，新版的行為是
  # **本輪整輪不掛單**（而不是退而求其次掛年化 7.88%）——這正是「年化 8% 以下不借」
  # 的意思。代價是市場走軟時機器人會閒置，空轉一天約損失 0.074 USD（以 344 USD 計）。
  minimum_rate: 0.00021918

  # 掛單利率不得低於「近期同天期常態成交價 × 這個比例」（見 D033）。
  # 排隊規則只看得到訂單簿，而訂單簿講的是「有人開價多少」，講不出「借款人實際付多少」。
  # 2026-08-16 夜間有人在簿子最底端掛了 182 萬 USD 的低價牆，排隊規則因此一路跟著
  # 把報價砍到年化 5.47%，並且真的用半價把 344 USD 借出去了——這道下限就是為了擋它。
  #
  # 1.0 = 完全不肯低於常態成交價（最保守，但市場一波動就會掛空）；
  # 0.85 = 借款人現在付 0.00025，我最低接受 0.0002125。調低比較容易成交但可能賤賣。
  market_floor_pct: 0.85

  # 常態成交價 = 同天期成交的**金額加權中位數**（有一半的錢在這個利率以上換手）。
  # 為什麼用金額而不是筆數：一筆大額借款會被拆成很多筆成交紀錄，筆數衡量的是
  # 撮合的破碎程度不是市場規模。2026-08-16 夜間實測，利率低於 0.00016 的成交
  # 佔筆數 11.5%、佔金額 29.9%——那是一道低價牆正在被慢慢啃掉。
  #
  # 先前試過「按時間分桶、每桶取中位數再取中位數」，實測不可用：那會讓
  # 「1 筆 150 USD 的死時段」跟「1211 筆共 867 萬 USD 的活躍時段」各算一票，
  # 同一時間點只要把取樣窗從 20 分鐘拉到 43 分鐘，算出來就從年化 8.75% 掉到 5.47%。
  min_trade_samples: 50       # 同天期成交少於這麼多筆就當樣本不足，本輪不掛單
  trade_window_hours: 6       # 只採用最近幾小時的成交（市場冷清時避免拿半天前的價格當現在）
  # 每輪抓多少筆成交。**不要調小**：實測 1000 筆在活躍時段只涵蓋 1.2 分鐘，
  # 樣本不足會讓機器人整輪不掛單。10000 是這支端點的上限，約可涵蓋 40 分鐘。
  trade_limit: 10000

  # 送出前把利率無條件捨去到幾位小數。**一定要捨去不能四捨五入**：
  # 利率越低排得越前面，四捨五入有一半機率把價格往上推，推過某一檔就會從
  # 「排在它前面」變成「跟它同價、而且排在它後面」。2026-08-16 夜間算出的
  # 0.000149995 被 round(x, 6) 推成 0.00015，正好等於那道 182 萬的牆（D033）。
  rate_decimals: 8

  # 以下三項只有 frr_plus 會用到。
  premium_rate: -0.00005
  long_duration_threshold: 0.00082

  # 利率階梯筆數。**1 = 不拆單，這是目前的正確設定**：
  # 單筆最低 150 USD，344 USD 最多只拆得出 2 筆，而第 2 筆會被 spread_step_pct
  # 乘到 0.000288——市場簿子頂端才 0.000270，等於一半的錢掛成永遠不會成交的死單。
  # 拆單要到 500 USD 以上、而且改成「百分位區間分佈」才有意義（TASKS.md P3-1）。
  spread_count: 1
  spread_step_pct: 0.15     # 每往上一階，利率乘上 (1 + 此值)；spread_count = 1 時不生效
  max_to_lend_usd: 0        # 本輪掛單總額上限（絕對值），0 = 不限制
  max_percent_to_lend: 0    # 本輪掛單總額上限（佔可用餘額的百分比，例如 70 表示 70%），0 = 不限制

engine:
  interval_seconds: 600     # 主迴圈巡檢間隔（秒）
  dry_run: false            # 2026-08-15 起以小額真金運作；曝險由融資錢包餘額鎖住
  cancel_settle_seconds: 3  # 取消舊掛單後等待餘額釋放的秒數（Bitfinex 取消為非同步）

  # 場上掛單與新算出的計畫差多少以內，算「條件沒變、不必重掛」。
  # **這條保護的是排隊位置**：同利率下先掛先成交，取消重掛會把位置歸零。
  # 沒有容差的話，市場價位小數點後幾位的漂移就會讓每輪都判定「不一樣」，
  # 等於一天把自己送回隊伍末端 144 次（同 D029 踩過的坑，只是這次燒的是排隊位置）。
  rate_tolerance_pct: 2.0
  alert_after_failures: 3   # 連續失敗幾輪就發出告警（只在跨過門檻與恢復時各通知一次）
  # 容器健康檢查的門檻：距離上一次心跳超過幾秒就判定 unhealthy。
  # 不設（或設 0）就自動採用 interval_seconds × 3 + 60，一般不需要動它；
  # 巡檢間隔設得特別長或特別短時才需要覆寫。由 scripts/healthcheck.py 讀取。
  # health_max_silence_seconds: 1860

database:
  path: data/lending.sqlite3   # SQLite 檔案位置（相對於專案根目錄）

retry:
  max_attempts: 5           # 單次 API 呼叫的總嘗試次數（含第一次），1 = 不重試
  base_delay: 2.0           # 首次退避秒數，之後每次加倍（2 → 4 → 8 → 16）
  max_delay: 60.0           # 單次退避秒數上限

logging:
  level: INFO
  file: logs/bfx_lending_bot.log
  # 時區。留空就採 `utils/clock.py` 的預設 `Asia/Taipei`（也可用環境變數 BFX_TIMEZONE
  # 覆寫，主機端的 scripts/notify_failure.py 只吃得到環境變數那條路）。
  # 日誌時間戳一律附上 `+0800` 偏移，這樣每一行自己就講得清楚是什麼時區——
  # 2026-08-16 之前機器人在容器裡寫 UTC、主機腳本寫 CST，兩者混在同一個檔案裡差 8 小時。
  timezone: Asia/Taipei
  max_bytes: 10485760       # 單一 log 檔上限（10MB），超過就輪替
  backup_count: 5           # 最多保留幾份輪替後的舊檔（.1 ~ .5）

line:
  enabled: true
  # 兩個值都放 ~/.config/bfx-lending-bot/secrets.env，**不要寫在這裡**（見 D022）：
  #   LINE_CHANNEL_ACCESS_TOKEN=…   LINE_TO_USER_ID=U…
  # 這裡留空字串當佔位，設定檔本身可以安心進版控。
  token: ""
  to_user_id: ""
  # 提醒：免費方案每月 200 則。這個管道只送事件（連續失敗／恢復／致命錯誤／
  # systemd 放棄重啟），例行的每輪巡檢結果只寫日誌，見 DECISIONS.md D024。
  #
  # 交易面通知（掛單上線／掛單消失／掛單被拒）。推的是**狀態轉換**不是每輪結果，
  # 所以一天通常 0～2 則；掛單利率的日常微調只寫日誌。
  # 這是留給額度的安全閥：真的燒太快就關掉它，系統面告警不受影響，
  # 事件也照樣寫進日誌——關掉的是通知，不是紀錄。
  push_trade_events: true
