name: 持續整合與部署

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 測試階段
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            # requirements-dev.txt 已經 -r requirements.txt，一次裝完執行與測試依賴
            python3 -m pip install -r requirements-dev.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行語法檢查
        run: python -m py_compile main.py config/settings.py api/rate_limiter.py db/models.py db/repository.py modules/exchange_client.py modules/lending_strategy.py modules/line_notifier.py scripts/healthcheck.py utils/logger.py utils/exceptions.py

      - name: 執行單元與功能測試
        # 這裡刻意不加 `|| true`：測試失敗就要擋下合併，否則寫了測試也攔不住壞掉的程式碼
        run: pytest tests/unit tests/functional -q

      - name: 執行 dry-run 端到端測試
        # 取代原本內嵌在 workflow 裡的 heredoc smoke test，驗證內容相同但改得動、看得懂。
        # -m "not live" 排除會連外網的測試，那些留給 integration job 跑。
        run: pytest tests/integration -q -m "not live"

  integration:
    name: 整合/系統測試
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: test
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 使用系統 Python (self-hosted)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements-dev.txt
          else
            echo "python3 not found on this runner. Install Python or change the job to run on ubuntu-latest." >&2
            exit 1
          fi

      - name: 執行整合測試（含 Bitfinex 公開端點）
        # 含 live 標記的測試：只打公開唯讀的 /v2/ticker/fUSD，不帶金鑰、不碰帳戶、
        # 不掛單。連不上時測試內部自行 skip，不會讓 CI 因外部服務抖動變紅燈。
        run: pytest tests/integration -q

  deploy:
    name: 容器化部署階段
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, shuyulendingbot]
    needs: [test, integration]
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 建立 Podman 映像
        run: |
          podman build -t shuyu-lending-bot .

      - name: 停止並移除舊容器
        run: |
          if podman container exists shuyu-lending-bot; then
            podman stop shuyu-lending-bot || true
            podman rm shuyu-lending-bot || true
          fi

      - name: 準備主機端掛載目錄
        # podman 的 bind mount **不會**自動建立主機端目錄（docker 會），目錄不存在時
        # 直接以 `statfs ...: no such file or directory` 搭配 exit code 125 失敗。
        # M3 加上 data volume 後主機端從沒建過這個目錄，部署因此一直掛在這一步。
        # 這裡用 mkdir -p 而非手動建立，才能在主機重建或換機時自動成立。
        run: |
          mkdir -p /workspace/deploy/active-bots/ShuyuLendingBot/logs
          mkdir -p /workspace/deploy/active-bots/ShuyuLendingBot/data

      - name: 啟動 Podman 容器
        run: |
          # data 也要掛出來：SQLite 檔留在容器內的話，每次重新部署掛單與收益紀錄就全沒了
          #
          # --restart=on-failure:3
          #   容器崩潰要能自己爬起來，但不能無限重啟：API 金鑰無效這類問題
          #   （main.py 以離開碼 2 表示）重開幾次都不會好，只會洗版日誌。
          #   restart policy 看不到離開碼，因此用「最多 3 次」從次數上節流。
          # --log-driver=k8s-file
          #   預設的 journald 在這台 rootless 環境實際取不到內容，`podman logs`
          #   一直是空的。改用 k8s-file 存成檔案，並加 max-size 免得無限長大。
          # --health-*
          #   讀 bot_state 的心跳判斷「還在巡檢嗎」，行程活著但卡死也看得出來。
          #   刻意不加 --health-on-failure=restart：先累積一段觀察期，確認判斷
          #   不會誤判再開自動重啟（見 DECISIONS.md D016）。
          podman run -d \
            --name shuyu-lending-bot \
            --restart=on-failure:3 \
            --log-driver=k8s-file \
            --log-opt max-size=10mb \
            --health-cmd "python /app/scripts/healthcheck.py" \
            --health-interval=60s \
            --health-retries=3 \
            --health-start-period=180s \
            -e BFX_SECRETS_FILE=/run/secrets/secrets.env \
            -v /workspace/deploy/active-bots/ShuyuLendingBot:/run/secrets:ro \
            -v /workspace/deploy/active-bots/ShuyuLendingBot/logs:/app/logs \
            -v /workspace/deploy/active-bots/ShuyuLendingBot/data:/app/data \
            shuyu-lending-bot

      - name: 檢查容器狀態
        run: |
          podman ps --filter "name=shuyu-lending-bot"
          podman inspect shuyu-lending-bot \
            --format '重啟策略：{{.HostConfig.RestartPolicy.Name}}（上限 {{.HostConfig.RestartPolicy.MaximumRetryCount}} 次）／日誌驅動：{{.HostConfig.LogConfig.Type}}'

      - name: 取得最近容器日誌
        # 讀掛載出來的日誌檔，而不是 `podman logs`：即使容器已經被收掉，檔案還在，
        # 而且這是程式自己寫的完整日誌（含輪替），比容器 stdout 可靠。
        run: |
          LOG_FILE=/workspace/deploy/active-bots/ShuyuLendingBot/logs/bfx_lending_bot.log
          for _ in $(seq 1 15); do
            [ -s "$LOG_FILE" ] && break
            sleep 2
          done
          if [ -s "$LOG_FILE" ]; then
            tail -n 100 "$LOG_FILE"
          else
            echo "::warning::30 秒內 $LOG_FILE 仍是空的，改用 podman logs 作為備援"
            podman logs --tail=100 shuyu-lending-bot || true
          fi
